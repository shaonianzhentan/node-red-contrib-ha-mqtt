<script type="text/html" data-help-name="ha-mqtt-datetime">
    <p>日期时间</p>
    <h3>输入</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dt>attributes <span class="property-type">object</span></dt>
    </dl>
    <h3>输出</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>Home Assistant 选择的日期时间，ISO 8601 UTC 格式（例如 <code>2025-12-01T12:33:00+00:00</code>）。</dd>
    </dl>
    <h3>详情</h3>
    <p>在 Home Assistant 中生成 datetime 实体（MQTT 日期时间平台，HA 2026.5 新增）。可在「配置」字段中设置 <code>timezone</code> 等选项。</p>
 </script>
