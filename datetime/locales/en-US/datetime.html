<script type="text/html" data-help-name="ha-mqtt-datetime">
    <p>Date/Time</p>
    <h3>Input</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dt>attributes <span class="property-type">object</span></dt>
    </dl>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>Date and time selected in Home Assistant, ISO 8601 in UTC (for example <code>2025-12-01T12:33:00+00:00</code>).</dd>
    </dl>
    <h3>Details</h3>
    <p>Generates a datetime entity in Home Assistant (MQTT date/time platform, introduced in HA 2026.5). Use the Configuration field for options such as <code>timezone</code>.</p>
 </script>
